# 插件清单: network 默认禁用, 启用(经确认)即授权联网; 免登录
id: cloud
name: 清华云盘
version: "0.1.0"
api_version: 1
description: "粘贴清华云盘分享链接(免登录), 浏览多课程资料库并把与课程名对应的目录登记为课程链接资源. 不整库下载."
entry: plugin
permissions: [network]
applies_to: [app]
params:
  - name: action
    type: choice
    label: 操作
    required: true
    default: browse
    choices:
      - [browse, 浏览预览]
      - [mount, 挂载登记]
  - name: url
    type: str
    label: 分享链接
    required: true
    help: "形如 https://cloud.tsinghua.edu.cn/d/<分享id>/"
  - name: depth
    type: int
    label: 搜索深度
    default: 2
    help: 目录匹配递归层数(1-3, 多课程资料库一般在第 2 层)
