name: build

# 双平台打包: workflow_dispatch 手动构建 (产物在 artifact);
# 推 v* 标签时构建并创建 GitHub Release 附双平台产物.
# tag 须与 shuimu/__init__.py 的 APP_VERSION 一致 (构建中有校验).

on:
  workflow_dispatch:
  push:
    branches: [packaging]   # CI 调试期临时: packaging 分支 push 自动触发, 并回 master 前移除
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # 一腿红不取消另一腿
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64 }
          - { os: windows-latest, platform: win-x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6,<7"
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Compute version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            base=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' shuimu/__init__.py)
            V="$base-dev.$(git rev-parse --short HEAD)"
          fi
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches APP_VERSION
        if: github.ref_type == 'tag'
        shell: bash
        run: grep -q "APP_VERSION = \"${GITHUB_REF_NAME#v}\"" shuimu/__init__.py
      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean shuimu.spec
      - name: CLI smoke test
        shell: bash
        run: |
          SFX="${{ runner.os == 'Windows' && '.exe' || '' }}"
          "dist/ShuimuBench/shuimu-cli$SFX" --help
          "dist/ShuimuBench/shuimu-cli$SFX" plugins
      - name: GUI smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e; timeout 15 ./dist/ShuimuBench/ShuimuBench; code=$?; set -e
          [ "$code" -eq 124 ] || exit 1   # 124 = 事件循环被 timeout 杀掉, 属正常
      - name: GUI smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\ShuimuBench\ShuimuBench.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "GUI exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Check for missing shuimu modules
        shell: bash
        run: |
          hits=$(find build -name "warn-*.txt" -exec grep -l "missing module named shuimu" {} +)
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi
      - name: Package artifacts (tar.gz)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-out
          tar -czf "release-out/ShuimuBench-${{ steps.ver.outputs.v }}-linux-x64.tar.gz" -C dist ShuimuBench
      - name: Package artifacts (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-out | Out-Null
          Compress-Archive -Path dist\ShuimuBench `
            -DestinationPath "release-out\ShuimuBench-${{ steps.ver.outputs.v }}-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ShuimuBench-${{ steps.ver.outputs.v }}-${{ matrix.platform }}
          path: release-out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ShuimuBench-*
          path: release-assets
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
