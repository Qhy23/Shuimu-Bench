# 水木工作台配置文件
# 全部字段可选, 缺省时使用内置默认值; 编辑后重启生效.
# 优先级: 用户数据目录 config.yaml > 项目根 config.yaml(本文件) > 内置默认值.

app:
  title: "水木工作台 ShuimuBench"
  window_size: [1200, 720]        # 主窗口初始尺寸(宽, 高)
  splitter_sizes: [240, 520, 400] # 三栏初始宽度(左/中/右)
  font_size: 13                   # 界面字号(px), 9-20, 运行时 Ctrl+=/- 可调

course:
  default_name: "未分组"          # 空工作区时自动创建的默认课程名

organize:
  fallback_category: "其他"       # 未匹配扩展名的归类
  categories:                     # 整理规则: 类别 -> 扩展名列表(小写带点)
    文档: [".pdf", ".doc", ".docx", ".ppt", ".pptx", ".txt", ".md", ".xls", ".xlsx", ".csv"]
    图片: [".png", ".jpg", ".jpeg", ".gif", ".bmp", ".svg", ".webp"]
    音视频: [".mp3", ".wav", ".mp4", ".mkv", ".mov", ".avi", ".flv"]
    压缩包: [".zip", ".rar", ".7z", ".tar", ".gz"]
    代码: [".py", ".c", ".cpp", ".h", ".java", ".js", ".ts", ".html", ".css"]

schedule:
  semester_start: "2026-09-14"    # 学期第 1 周的周一; 留空不显示周次
  week_count: 23                  # 学期总周数; 秋季 16 课+2 考+5 寒假共 23, 春季 16+2 共 18, 暑期各年不同; 0 为不限制, 学期外周显示"假期"

fileops:
  trash_dir: ""                   # 文件页删除的回收站目录; 留空用系统回收站
                                  # (Linux 为 ~/.local/share/Trash, Windows 为系统回收站);
                                  # WSL 无桌面回收站, 测试时建议指定自建目录,
                                  # 如 "data/trash"(相对路径按项目根解析);
                                  # 本机专属配置可写在用户数据目录 config.yaml(优先级更高, 不入仓库)

learn:
  download_dir: ""               # 学堂课件/附件下载根目录; 留空用 data/learn,
                                  # 下载文件按课程名建子目录, 登记进关联课程(引用式)

ai:                              # AI 工具调优项; base_url/model/api_key 存
                                 # data/ai-config.json(0o600, 不入仓库),
                                 # 常用服务地址: 智谱 https://open.bigmodel.cn/api/paas/v4
                                 #   (Claude Code 资源包走 https://open.bigmodel.cn/api/anthropic,
                                 #    自动按 Anthropic 协议调用, 与 paas/v4 额度不通用)
                                 # DeepSeek https://api.deepseek.com/v1
                                 # Kimi https://api.moonshot.cn/v1
                                 # Ollama 本地 http://localhost:11434/v1
  max_context_chars: 60000       # 上下文总字符预算
  per_file_chars: 20000          # 单文件提取字符上限
  max_pdf_pages: 30              # PDF 按页提取上限
  timeout_seconds: 120           # 请求超时秒数(含流式读)
  keep_messages: 200             # 对话历史保留条数(超出删最旧)
