# 水木工作台常用链接模板(links.example.yaml).
# 首次运行时复制为 data/links.yaml, 程序实际读取的是后者(可在其中自由编辑).
# 条目: name 显示名称(全局唯一), url 须以 http:// 或 https:// 开头,
#       group 可选分组(留空或省略为"未分组"; 分组按首次出现顺序显示).
# 注意: GUI 保存(添加/编辑/删除)会重写 data/links.yaml, 手写注释会丢失.
