# 水木工作台日程模板(schedule.example.yaml).
# 首次运行时复制为 data/schedule.yaml, 程序实际读取的是后者(可在其中自由编辑).
# 三段: courses=导入的课程数据(个人校历 html, 一般不手编),
#       manual=手动添加的事件, todos=任务备忘.
# 注意: GUI 保存(新建/勾选 todo)会重写 data/schedule.yaml, 手写注释会丢失.

courses:
  - date: 2026-10-27
    start: "19:20"        # 时间建议加引号
    end: "20:55"
    title: AI 编程进阶：方法与实践
    location: 建华/经管新楼A312

manual: []                 # 手动添加的事件, 格式与 courses 相同

todos:
  - id: 1                 # id 由程序维护, 新增条目可不写, 保存时自动补
    title: 微积分作业 6
    due: 2026-10-26
    course: 微积分A(1)
    done: false
  - id: 2
    title: 把下载的课件整理进课程工作区
    done: false
