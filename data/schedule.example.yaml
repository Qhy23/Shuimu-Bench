# 水木工作台日程模板(schedule.example.yaml).
# 首次运行时复制为 data/schedule.yaml, 程序实际读取的是后者(可在其中自由编辑).
# 三段: timetable=每周重复课表, events=一次性事件, todos=任务备忘.
# 注意: GUI 保存(新建/勾选 todo)会重写 data/schedule.yaml, 手写注释会丢失.

timetable:
  - weekday: 2            # 1=周一 ... 7=周日
    start: "19:20"        # 时间须加引号(不加引号会被 YAML 当成 60 进制数)
    end: "20:55"
    title: AI 编程进阶:方法与实践
    location: 待定
    weeks: [5, 12]        # 可选, 学期第几周到第几周; 需在 config.yaml 配置 semester_start 后生效

events:
  - date: 2026-10-27      # 日期可不加引号
    start: "19:00"
    end: "21:00"
    title: AI 编程进阶第 3 讲(代码生成, 理解与调试)
    location: 待定

todos:
  - id: 1                 # id 由程序维护, 新增条目可不写, 保存时自动补
    title: 微积分作业 6
    due: 2026-10-26
    course: 微积分A(1)
    done: false
  - id: 2
    title: 把下载的课件整理进课程工作区
    done: false
